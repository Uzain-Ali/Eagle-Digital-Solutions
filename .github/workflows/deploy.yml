name: 🚀 Deploy Eagle Digital Solutions via FTP

on:
  push:
    branches:
      - main   # change to 'master' if that's your default branch

jobs:
  ftp-deploy:
    name: Upload website to Namecheap hosting
    runs-on: ubuntu-latest

    steps:
      - name: 🧩 Checkout repository
        uses: actions/checkout@v4

      - name: 📂 Deploy PHP site to Namecheap via SFTP
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          port: ${{ secrets.FTP_PORT }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local_path: ./
          remote_path: ${{ secrets.FTP_PATH }}/
          sftp_only: true
          exclude: |
            */another_project/*
            */.git/**
            */.github/**
            */node_modules/*
            */.vscode/*